services:
  - type: web
    name: courier-integration-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BULK_MODE
        value: poll
      - key: BULK_CONCURRENCY
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "60"
      - key: RATE_LIMIT_BULK_MAX
        value: "10"
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        sync: false
      - key: API_KEYS
        sync: false
      - key: URBANEBOLT_BASE_URL
        value: https://uat.urbanebolt.in
      - key: URBANEBOLT_USERNAME
        sync: false
      - key: URBANEBOLT_PASSWORD
        sync: false
      - key: URBANEBOLT_CUSTOMER_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: courier-db
          property: connectionString

databases:
  - name: courier-db
    plan: free
    databaseName: courier
    user: courier
